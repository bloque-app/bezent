[package]
name = "bezent-signer"
description = "bezent signer: signs only intents the core recorded and holds no state (DEC-3, REQ-AR-3)"
edition.workspace = true
version.workspace = true
license = "GPL-3.0-or-later"
repository.workspace = true
publish.workspace = true

[lib]
name = "bezent_signer"

[[bin]]
name = "bezent-signer"
path = "src/main.rs"

[dependencies]
bezent-health = { path = "../../crates/health" }
bezent-store = { path = "../../crates/store" }
bezent-vault = { path = "../../crates/vault" }
sqlx.workspace = true
tokio = { workspace = true, features = ["net", "io-util", "sync", "time", "signal", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
sha2 = "0.10"
sha3 = "0.10"
blake2 = "0.10"
subtle = "2"
zeroize = { version = "1", features = ["std", "serde"] }
# Kreivo accounts: sr25519 and ECDSA; EVM: secp256k1 (F-005 plan).
schnorrkel = "0.11"
k256 = { version = "0.13", default-features = false, features = ["ecdsa", "std", "pkcs8"] }
# The statement key (REQ-PR-1, F-004): ed25519.
ed25519-dalek = { version = "2", features = ["zeroize"] }
# Safe wrappers for setrlimit, PR_SET_DUMPABLE and geteuid (REQ-CU-1; the workspace forbids unsafe).
rustix = { version = "1", features = ["process", "fs"] }
aws-sdk-kms = { version = "1.123.0", default-features = false, features = ["default-https-client", "rt-tokio", "behavior-version-latest"] }
# The signer link's mutual TLS (PUB-1b): TLS 1.3 only, on ring explicitly. The lockfile also holds
# aws-lc-rs (the AWS SDK's), so no process-wide default provider is assumed.
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
aws-config = { version = "1.12.0", default-features = false, features = ["rt-tokio", "default-https-client", "behavior-version-latest"] }

[lints]
workspace = true

[dev-dependencies]
# An in-process root, intermediate and leaves for the link tests (nothing committed).
rcgen = { version = "0.13", default-features = false, features = ["crypto", "pem", "ring"] }
base64 = "0.22"
aws-credential-types = "1.3.0"
# The Vault signing-plugin test (tests/vault_plugin.rs): admin calls to a dev server, and an
# implementation of secp256k1 recovery and Keccak-256 apart from the engine's (k256, sha3).
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
secp256k1 = { version = "0.30", features = ["recovery"] }
tiny-keccak = { version = "2", features = ["keccak"] }
