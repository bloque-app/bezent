[package]
name = "bezent-ingress"
description = "bezent ingress: the request and query surfaces, over HTTP and JSON, on the store (DEC-3, DEC-15; F-002)"
edition.workspace = true
version.workspace = true
license = "GPL-3.0-or-later"
repository.workspace = true
publish.workspace = true

[lib]
name = "bezent_ingress"

[[bin]]
name = "bezent-ingress"
path = "src/main.rs"

[dependencies]
bezent-logging = { path = "../../crates/logging" }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio", "tracing"] }
bezent-core.workspace = true
bezent-health = { path = "../../crates/health" }
bezent-store = { path = "../../crates/store" }
bezent-vault = { path = "../../crates/vault" }
blake2 = "0.10"
bs58 = "0.5"
# Webhooks (REQ-ST-5, issue #2): secrets and URLs sealed at rest under the ingress's webhook key,
# HMAC-SHA256 signatures, and the dispatcher's HTTP client.
chacha20poly1305 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["std", "serde", "clock"] }
getrandom = "0.3"
hex = "0.4"
hmac = "0.12"
# The public status route's listener (review M1, L3 of PR #139): a header-read timeout, a bound on
# the request head and on open connections, which `axum::serve` does not expose; and a request
# timeout.
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "server-graceful", "service"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sha3 = "0.10"
sqlx = { workspace = true, features = ["json", "chrono"] }
tokio = { workspace = true, features = ["io-util", "net", "signal", "sync", "time"] }
toml = "0.8"
tower-http = { version = "0.6", features = ["timeout"] }
tracing = "0.1"
url = "2"
utoipa = { version = "5", features = ["chrono"] }

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }

[lints]
workspace = true
