# The endpoint's configuration shape, for `--check` in CI and the tests (T-009-01). It declares
# Polygon PoS. No secret is here: the files it names hold them, and they need not exist for --check.
# The vault, its Roles modifier and the emitter are placeholders until the vault is deployed (F-014);
# the lane's key is Foundry's test account 4, a test key with no power anywhere (REQ-KY-6).
network = "polygon"
chain_id = 137
# Pinned at the fork block of e2e/evm/forks.env; the hash was read from two public providers.
pinned_block = 95400000
pinned_hash = "0xcc89572742615188f853cc9e74e7f5279a369fbb4a019afc8027ec974b7fedd3"
vault = "0x00000000000000000000000000000000000000a1"
roles = "0x00000000000000000000000000000000000000a2"
emitter = "0x00000000000000000000000000000000000000a3"
# MultiSendCallOnly 1.4.1 (F-008 NOTES, "Pinned external addresses").
multisend = "0x9641d764fc13c8B624c04430C7356C1C7C8102e2"
delivery_role = "bezent.delivery"
start_block = 95400000
max_range = 500
database_url_file = "/run/secrets/bezent-evm-polygon-db"

[[providers]]
name = "a"
url_file = "/run/secrets/bezent-evm-polygon-rpc-a"

[[providers]]
name = "b"
url_file = "/run/secrets/bezent-evm-polygon-rpc-b"

# USDT0 -> USDC through the declared Uniswap v3 pool (F-008 NOTES, "Pinned pools"). A proposal: no
# convertible is admitted by a recorded declaration yet (REQ-AS-7).
[[convertibles]]
token = "0xc2132D05D31c914a87C6611C10748AEb04B58e8F"
pool = "0x31083a78E11B18e450fd139F9ABEa98CD53181B7"

[lane]
key = "polygon-payout"
public_key = "0x03bf6ee64a8d2fdc551ec8bb9ef862ef6b4bcb1805cdc520c3aa5866c0575fd3b5"

[gas]
max_gas = 500000
max_fee_per_gas = "3000000000000"

[signer]
socket = "/run/bezent-signer/signer.sock"
uid = 1001
token_file = "/run/secrets/bezent-evm-polygon-signer-token"
