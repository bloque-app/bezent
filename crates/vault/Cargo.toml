[package]
name = "bezent-vault"
description = "bezent's Vault client: IAM login, KV reads with field selection, PKI issue, and the SecretRef configuration type (issue #64)"
edition.workspace = true
version.workspace = true
license = "Apache-2.0 OR MIT"
repository.workspace = true
publish.workspace = true

[lib]
name = "bezent_vault"

[dependencies]
# The same feature sets as the signer's (services/signer/Cargo.toml): no second TLS backend.
aws-config = { version = "1.12.0", default-features = false, features = ["rt-tokio", "default-https-client", "behavior-version-latest"] }
aws-credential-types = "1.3.0"
aws-sigv4 = { version = "1.6.0", default-features = false, features = ["sign-http"] }
aws-smithy-runtime-api = { version = "1.19.0", features = ["client"] }
base64 = "0.22"
percent-encoding = "2"
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
ring = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { workspace = true, features = ["sync", "time"] }
url = "2"
zeroize = { version = "1", features = ["std", "serde"] }

[dev-dependencies]
toml = "0.8"
tokio = { workspace = true, features = ["net", "io-util", "time"] }

[lints]
workspace = true
