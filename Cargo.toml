#
# bezent: one Rust workspace for the core and the four services (PLAN.md `DEC-1`).
#
# Licences (DEC-20, docs/oss/LICENSING.md): crates/ are Apache-2.0 OR MIT, services/ GPL-3.0-or-later;
# each package declares its own, so the workspace sets none.
#
#   crates/core              F-001   types: amounts, asset and network ids, references, coordinates
#   crates/store             F-001   the PostgreSQL schema of `DEC-4` (sqlx migrations) and its store tests
#   services/ingress         F-001   empty binary; behaviour from F-002
#   services/kreivo-endpoint F-001   empty binary
#   services/evm-endpoint    F-001   empty binary
#   services/signer          F-001   empty binary
#   services/core            F-003   the core: state machine, conditions, review (DEC-3)
#   services/sidecar         e2e   ingress, core, a test signer and a chain-event driver in one process, for other repos' harnesses (TEST only)
#
# The ink! contract (contracts/bezent/) and the Foundry projects (contracts/evm/) are workspaces of
# their own and are not members here.
[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/store",
    "services/ingress",
    "services/kreivo-endpoint",
    "services/evm-endpoint",
    "services/signer",
    "services/core",
    "services/sidecar",
]
# Workspaces of their own (F-006 and later): never members of this one.
exclude = ["contracts/bezent"]

[workspace.package]
edition = "2024"
version = "0.1.0"
repository = "https://github.com/bloque-app/bezent"
publish = false

[workspace.dependencies]
bezent-core = { path = "crates/core" }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-webpki", "postgres", "migrate", "macros"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
trybuild = "1"

# The Kreivo endpoint's light client (F-007, PLAN DEC-5): smoldot and smoldot-light from aledgent's fork,
# bloque-app/smoldot, pinned by commit, as aledgent's workspace pins them. Released smoldot recalculates, once a runtime call
# has finished, the root of every child trie the call wrote, which a node's call proof does not cover, so
# a dry run of a contract call that writes child storage failed (aledgent#121; aledgent F-027 NOTES,
# decisions 42 and 43). bezent's contract writes child storage on every mint.
[patch.crates-io]
smoldot = { git = "https://github.com/bloque-app/smoldot", rev = "67ad6c379d271be27b5cdd841dcf0d321668d30d" }
smoldot-light = { git = "https://github.com/bloque-app/smoldot", rev = "67ad6c379d271be27b5cdd841dcf0d321668d30d" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
float_arithmetic = "deny"
cast_precision_loss = "deny"
