[package]
name = "bezent-e2e-network"
version = "0.1.0"
edition = "2021"
publish = false
license = "Apache-2.0 OR MIT"
description = "bezent's zombienet test bed (F-013): a relay chain and Kreivo 0.17.1 with the bridged assets in genesis."

# A workspace of its own, kept out of the root one: zombienet-sdk brings some 600 crates (subxt,
# litep2p, whose build script needs `protoc`), none of which the services link. It is built only
# by `.github/workflows/e2e-zombienet.yml`, on a self-hosted pool (the repository variable ZOMBIENET_RUNS_ON).
#
# Forked from aledgent's `e2e/network` (its Cargo.lock is the proven resolution of zombienet-sdk
# 0.4.15 on that pool; only the root package's name changed).
[workspace]

[dependencies]
serde_json = "1.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time"] }
# zombienet narrates the spawn through `tracing`; without a subscriber it looks hung.
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zombienet-sdk = "=0.4.15"

# Built to be run, once, in CI: no debug info (it is most of the size and the link time).
[profile.ci]
inherits = "dev"
debug = 0
incremental = false
