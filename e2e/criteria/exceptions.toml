#
# F-013: V0 criteria that have no test at their layer yet, each with the reason and what unblocks it.
# `tools/ci/criteria_map.py` fails if a criterion has neither a test nor an entry here, and fails if an entry
# stays after its criterion gets a test (the entry is removed in the pull request that adds the test). A test
# that only names a criterion is never the way out: a test named for a criterion MUST verify it.
# Reviewed by the spec owner (CODEOWNERS).

# No criterion is an exception at the moment: each has a test at its layer. A criterion with a test can still be
# partial or failing: that is listed in known_unmet.toml.
[exception]

# A V0 story that SPEC section 6 gives no acceptance criterion. Listed so that a new one cannot appear silently.
[story_without_criteria."US-H2"]
reason = "SPEC gives the story no AC-*, only REQ-ST-1 (find a transfer's transactions on each network without bezent's database); this map does not measure REQ-ST-1's tests"
