#
# F-013: V0 criteria that HAVE a test at their layer yet are known not met. exceptions.toml is for the criteria
# with no test; this is for the ones the map would otherwise call `covered`, though the feature notes say they
# are partial or failing. Each entry names the criterion, `missing` (what is not met) and `closed_by` (the issue
# or pull request that closes it).
#
# `tools/ci/criteria_map.py` reports the criterion as `known unmet` and stays green on a pull request, as for an
# exception; `tools/ci/release_gate.py` FAILS while any entry remains. An entry naming a criterion that is not a
# V0 criterion of SPEC.md is an error. Removing an entry needs the spec owner's review (CODEOWNERS): it is the
# claim that the criterion is now met.

