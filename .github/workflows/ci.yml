# F-001 T-001-06 (DEC-1): build, fmt, clippy, unit tests and the store tests against a real
# PostgreSQL, on every pull request and on main. The toolchain comes from rust-toolchain.toml.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: (rustup toolchain install || rustup show) && cargo --version
      - run: cargo fmt --all -- --check

  clippy:
    name: build and clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: (rustup toolchain install || rustup show) && cargo --version
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # The empty services start, read their config path, and exit cleanly (T-001-01). The ingress
      # serves since F-002: its start against the store and its graceful shutdown are an
      # integration test (T-002-01); here it only prints its OpenAPI document.
      - name: services start and stop
        run: |
          ./target/debug/bezent-ingress openapi | diff - services/ingress/openapi.json
      # The EVM endpoint (F-009) checks its configuration, and refuses two providers that are one
      # (DEC-12).
      - name: evm-endpoint configuration check
        run: |
          ./target/debug/bezent-evm-endpoint --check services/evm-endpoint/fixtures/endpoint.toml
          if ./target/debug/bezent-evm-endpoint --check services/evm-endpoint/fixtures/same-provider.toml; then
            echo "two providers that are one were not refused" && exit 1
          fi
      # The Kreivo endpoint (F-007) checks its configuration and pinned chain spec, and refuses a
      # spec of another network than the declared one (AC-I4.1).
      - name: kreivo-endpoint configuration check
        run: |
          ./target/debug/bezent-kreivo-endpoint --check services/kreivo-endpoint/fixtures/endpoint.toml
          if ./target/debug/bezent-kreivo-endpoint --check services/kreivo-endpoint/fixtures/wrong-network.toml; then
            echo "the wrong network was not refused" && exit 1
          fi
      # The signer (F-005) loads and checks its configuration and test keys, then exits.
      - name: signer configuration check
        run: ./target/debug/bezent-signer --check services/signer/fixtures/signer.json
      # The core (F-003) reads and checks its configuration, then exits.
      - name: core configuration check
        run: ./target/debug/bezent-core --check services/core/fixtures/core.toml

  test:
    name: tests
    runs-on: ubuntu-latest
    env:
      # Each store test creates its own database on this server (#[sqlx::test]).
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/ci-postgres
        id: pg
        with:
          variant: "16"
          token: ${{ secrets.GITHUB_TOKEN }}
          dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub-token: ${{ secrets.DOCKERHUB_TOKEN }}
      - run: tools/ci/pg-up.sh "${{ steps.pg.outputs.image }}"
      - run: (rustup toolchain install || rustup show) && cargo --version
      - uses: Swatinem/rust-cache@v2
      # The restore drill (T-001-05) runs pg_dump and psql; their major version must be at least
      # the server's.
      - name: PostgreSQL client 16
        run: |
          if ! pg_dump --version | grep -qE ' (1[6-9]|[2-9][0-9])\.'; then
            sudo apt-get update -q
            sudo apt-get install -yq postgresql-client-16
            echo "/usr/lib/postgresql/16/bin" >> "$GITHUB_PATH"
          fi
      - run: pg_dump --version && psql --version
      - run: cargo test --workspace --locked

  # A managed server has no superuser (AWS RDS: the master user is rds_superuser): the migrations
  # must run as a CREATEROLE login that owns the database. On PostgreSQL 16 a role that makes a role
  # is made a member of it; this job runs the whole chain as such an owner on a server of its own
  # (no store role exists yet, so the owner creates them all) and compares the result with a
  # superuser's run of the same release.
  migrate-createrole-owner:
    name: migrations as a CREATEROLE owner (PostgreSQL 16)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      BEZENT_TEST_FRESH_SERVER: "1"
    steps:
      - uses: actions/checkout@v4
      - run: (rustup toolchain install || rustup show) && cargo --version
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p bezent-migrate --test migrate --locked createrole_owner -- --test-threads=1

  # The services reach PostgreSQL over TLS and fail closed (bezent_store::tls): against a server that
  # forces TLS with a throwaway CA (tools/ci/tls-postgres.sh), and one that offers none.
  database-tls:
    name: database TLS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/ci-postgres
        id: pg
        with:
          variant: "16"
          token: ${{ secrets.GITHUB_TOKEN }}
          dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub-token: ${{ secrets.DOCKERHUB_TOKEN }}
      - run: tools/ci/pg-up.sh "${{ steps.pg.outputs.image }}"
      - run: (rustup toolchain install || rustup show) && cargo --version
      - uses: Swatinem/rust-cache@v2
      - name: A PostgreSQL that forces TLS
        env:
          BEZENT_CI_POSTGRES_IMAGE: ${{ steps.pg.outputs.image }}
        run: tools/ci/tls-postgres.sh "$RUNNER_TEMP/tls" 5433 | tee -a "$GITHUB_ENV"
      - name: TLS against both servers
        env:
          BEZENT_PLAIN_TEST_HOSTPORT: localhost:5432
        run: cargo test -p bezent-store --lib --test tls --locked -- --include-ignored

  # The Vault client (crates/vault, issue #64) against a real Vault, `vault server -dev`, with a fake
  # STS the test starts itself: Vault forwards the signed GetCallerIdentity call to its configured
  # sts_endpoint and trusts the answer, so the login, KV v1 and v2 and PKI issue run end to end
  # without AWS (crates/vault/tests/dev_server.rs). The binary is verified against HashiCorp's
  # checksum list for the pinned version, and that list against its detached signature, made with
  # HashiCorp's release key (pinned by fingerprint below).
  #
  # The same server runs the signer's Vault signing-plugin engine against the plugin itself
  # (services/signer/tests/vault_plugin.rs): blockchain-signer-vault-plugin is fetched at a pinned,
  # reviewed commit, its golang.org/x/net and google.golang.org/grpc are bumped past the
  # vulnerabilities govulncheck reported for that commit, it is built here, registered in the
  # catalog by the SHA-256 of what was built, and mounted.
  vault-dev:
    name: Vault client and signing plugin against vault server -dev
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VAULT_VERSION: "2.0.3"
      # HashiCorp Security's release-signing key, https://www.hashicorp.com/trust/security
      HASHICORP_KEY_FPR: C874011F0AB405110D02105534365D9472D7468F
      # A dev server's throwaway root token, on loopback, for this job only.
      BEZENT_VAULT_DEV_TOKEN: bezent-ci-dev-root
      BEZENT_VAULT_DEV_ADDR: http://127.0.0.1:8200
      PLUGIN_COMMAND: blockchain-signer-vault-plugin
      BEZENT_VAULT_PLUGIN_NAME: bezent-evm-signer
      BEZENT_VAULT_PLUGIN_MOUNT: signer-bezent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.1"
          cache: false
      - name: Build the signing plugin (the reproducible build CI publishes) and check its pin
        run: |
          set -euo pipefail
          tools/ci/build-vault-plugin.sh "$RUNNER_TEMP/plugin-build"
          (cd "$RUNNER_TEMP/plugin-build" && sha256sum -c "$GITHUB_WORKSPACE/deploy/vault-plugin.sha256")
          mkdir -p "$RUNNER_TEMP/vault-plugins"
          cp "$RUNNER_TEMP/plugin-build/$PLUGIN_COMMAND" "$RUNNER_TEMP/vault-plugins/"
          sha=$(cut -d' ' -f1 "$RUNNER_TEMP/plugin-build/SHA256SUMS")
          echo "BEZENT_VAULT_PLUGIN_SHA256=$sha" >> "$GITHUB_ENV"
      - name: vault server -dev
        run: |
          set -euo pipefail
          base="https://releases.hashicorp.com/vault/$VAULT_VERSION"
          cd "$RUNNER_TEMP"
          curl -fsSLO "$base/vault_${VAULT_VERSION}_linux_amd64.zip"
          curl -fsSLO "$base/vault_${VAULT_VERSION}_SHA256SUMS"
          curl -fsSLO "$base/vault_${VAULT_VERSION}_SHA256SUMS.sig"
          curl -fsSL https://www.hashicorp.com/.well-known/pgp-key.txt -o hashicorp.asc
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          install -d -m 700 "$GNUPGHOME"
          gpg --batch --import hashicorp.asc
          gpg --batch --with-colons --fingerprint | grep "^fpr:::::::::$HASHICORP_KEY_FPR:"
          gpg --batch --verify "vault_${VAULT_VERSION}_SHA256SUMS.sig" "vault_${VAULT_VERSION}_SHA256SUMS"
          sha256sum -c --ignore-missing "vault_${VAULT_VERSION}_SHA256SUMS"
          unzip -q "vault_${VAULT_VERSION}_linux_amd64.zip" vault
          nohup ./vault server -dev -dev-root-token-id="$BEZENT_VAULT_DEV_TOKEN" \
            -dev-listen-address=127.0.0.1:8200 \
            -dev-plugin-dir="$RUNNER_TEMP/vault-plugins" > vault.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fs "$BEZENT_VAULT_DEV_ADDR/v1/sys/health" > /dev/null && exit 0
            sleep 1
          done
          cat vault.log
          exit 1
      - name: Register the signing plugin by its SHA-256 and mount it
        run: |
          set -euo pipefail
          v() { curl -fsS -H "X-Vault-Token: $BEZENT_VAULT_DEV_TOKEN" "$@"; }
          catalog="$BEZENT_VAULT_DEV_ADDR/v1/sys/plugins/catalog/secret"
          v -X PUT "$catalog/$BEZENT_VAULT_PLUGIN_NAME" \
            -d "{\"sha256\":\"$BEZENT_VAULT_PLUGIN_SHA256\",\"command\":\"$PLUGIN_COMMAND\"}"
          v -X POST "$BEZENT_VAULT_DEV_ADDR/v1/sys/mounts/$BEZENT_VAULT_PLUGIN_MOUNT" \
            -d "{\"type\":\"$BEZENT_VAULT_PLUGIN_NAME\"}"
          # The same binary registered under a SHA-256 that is not its own does not mount.
          v -X PUT "$catalog/bezent-wrong-sha" \
            -d "{\"sha256\":\"$(printf '0%.0s' $(seq 1 64))\",\"command\":\"$PLUGIN_COMMAND\"}"
          if v -X POST "$BEZENT_VAULT_DEV_ADDR/v1/sys/mounts/signer-wrong-sha" \
            -d '{"type":"bezent-wrong-sha"}'; then
            echo "a plugin whose SHA-256 does not match was mounted" >&2
            exit 1
          fi
      - run: (rustup toolchain install || rustup show) && cargo --version
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p bezent-vault --locked -- --include-ignored
      - name: The signer's signing-plugin engine against the plugin
        run: cargo test -p bezent-signer --locked --test vault_plugin --test engines -- --include-ignored
      - name: Vault's log
        if: failure()
        run: cat "$RUNNER_TEMP/vault.log"

  # F-009: the EVM endpoint against an anvil fork of Polygon at the block e2e/evm/forks.env pins,
  # with F-008's vault deployed by its own script and Foundry's test keys (services/evm-endpoint/
  # tests/fork.rs). anvil reads the pinned state from the upstream archive RPC; nothing is sent to
  # a real network.
  evm-endpoint-fork:
    name: evm-endpoint fork tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      BEZENT_EVM_FORK_URL: ${{ secrets.POLYGON_RPC_URL || 'https://polygon.drpc.org' }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: ./.github/actions/ci-postgres
        id: pg
        with:
          variant: "16"
          token: ${{ secrets.GITHUB_TOKEN }}
          dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub-token: ${{ secrets.DOCKERHUB_TOKEN }}
      - run: tools/ci/pg-up.sh "${{ steps.pg.outputs.image }}"
      - run: (rustup toolchain install || rustup show) && cargo --version
      - uses: Swatinem/rust-cache@v2
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1
      - name: anvil's fork state cache
        uses: actions/cache@v4
        with:
          path: ~/.foundry/cache/rpc
          key: evm-endpoint-fork-${{ hashFiles('e2e/evm/forks.env', 'services/evm-endpoint/tests/fork.rs') }}
      - name: "T-009-01 to T-009-06 on the Polygon fork"
        run: cargo test -p bezent-evm-endpoint --test fork --locked -- --test-threads=1

  # Licensing (docs/oss/LICENSING.md): every tracked file carries its licence (an SPDX header where
  # the format allows a comment, REUSE.toml otherwise), the licence its path requires, and every
  # dependency's licence is on deny.toml's list. Runs for every pull request, forks included: it
  # needs no secret.
  licensing:
    name: licence headers, REUSE and dependency licences
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: SPDX headers and Cargo licence fields
        run: python3 tools/oss/spdx.py --check
      - name: REUSE compliance
        uses: fsfe/reuse-action@v5
      - run: (rustup toolchain install || rustup show) && cargo --version
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - name: Dependency licences (workspace)
        run: cargo deny check licenses
      - name: Dependency licences (ink! contract)
        run: cd contracts/bezent && cargo deny check licenses

  # Secrets: the whole tree is scanned on every pull request. The allowlist (.gitleaks.toml) names the
  # published test keys and public constants; anything else fails the job.
  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks dir --config .gitleaks.toml --redact --no-banner --exit-code 1 .
