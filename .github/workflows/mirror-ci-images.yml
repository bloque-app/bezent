name: Mirror CI images

# Copies the PostgreSQL images the CI uses (pinned by digest in .github/ci-images.env) to
#
#   ghcr.io/bloque-app/bezent-ci-postgres:16
#   ghcr.io/bloque-app/bezent-ci-postgres:18-alpine
#
# so that CI jobs do not pull them anonymously from Docker Hub or ECR Public, which answer
# `toomanyrequests` to the shared runner addresses. The copy is of the manifest list itself, so the
# digest in GHCR is the digest upstream, and the jobs pin one value. Weekly, and on demand after a
# bump of ci-images.env. An image already there at the pinned digest is left alone.
#
# The package must be public, and this repository must have write access to it: after its first
# push, Package settings > Manage Actions access > add bloque-app/bezent (Write), and Change
# visibility > Public.

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

concurrency:
  group: mirror-ci-images
  cancel-in-progress: false

jobs:
  mirror:
    name: mirror
    if: github.repository == 'bloque-app/bezent'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    env:
      TARGET: ghcr.io/bloque-app/bezent-ci-postgres
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 # v3.5.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Copy by digest
        run: |
          set -euo pipefail
          . .github/ci-images.env
          retry() { for i in 1 2 3 4 5; do "$@" && return 0; sleep $((i * 15)); done; return 1; }
          for pair in "16:$BEZENT_CI_POSTGRES_16" "18-alpine:$BEZENT_CI_POSTGRES_18_ALPINE"; do
            tag=${pair%%:sha256:*}
            digest=sha256:${pair##*:sha256:}
            have=$(docker buildx imagetools inspect "$TARGET:$tag" --format '{{json .Manifest}}' 2> /dev/null | jq -r .digest || true)
            if [ "$have" != "$digest" ]; then
              retry docker buildx imagetools create -t "$TARGET:$tag" "docker.io/library/postgres@$digest"
            fi
            got=$(docker buildx imagetools inspect "$TARGET:$tag" --format '{{json .Manifest}}' | jq -r .digest)
            test "$got" = "$digest" || { echo "$TARGET:$tag is $got, expected $digest"; exit 1; }
            echo "- \`$TARGET:$tag@$digest\`" >> "$GITHUB_STEP_SUMMARY"
          done
