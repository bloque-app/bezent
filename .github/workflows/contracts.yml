name: Contracts

# F-006: bezent's ink! contract is a workspace of its own (`contracts/bezent`), excluded from any
# root workspace. This workflow runs only when it changes. It follows aledgent's `contracts.yml`.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "contracts/bezent/**"
      - ".github/workflows/contracts.yml"
  pull_request:
    paths:
      - "contracts/bezent/**"
      - ".github/workflows/contracts.yml"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Pinned. 5.0.3 builds ink! 5 contracts for `pallet-contracts`, which is what Kreivo runs.
  CARGO_CONTRACT_VERSION: 5.0.3

defaults:
  run:
    working-directory: contracts/bezent

jobs:
  # The toolchain is 1.91, from `contracts/bezent/rust-toolchain.toml`: cargo-contract 5.0.3's WASM
  # build does not compile with Rust 1.92 and later.
  test:
    name: fmt, clippy and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.91
        with:
          components: rustfmt, clippy, rust-src
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts/bezent
          key: test
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      # ink! generates `#[no_mangle]` exports, so the crate cannot `forbid(unsafe_code)`; our own
      # code must still have none.
      - name: No unsafe code
        run: "! grep -rnw --include='*.rs' unsafe src"

  build:
    name: cargo contract build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.91
        with:
          components: rust-src
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts/bezent
          key: build
          cache-bin: true
      - name: Install cargo-contract ${{ env.CARGO_CONTRACT_VERSION }}
        run: |
          if ! cargo contract --version 2>/dev/null | grep -q "$CARGO_CONTRACT_VERSION"; then
            cargo install cargo-contract --version "$CARGO_CONTRACT_VERSION" --locked --force
          fi
          cargo contract --version
      - run: cargo contract build --release
      - name: Size against Kreivo's MaxCodeLen (192 KiB)
        run: |
          size=$(stat -c %s target/ink/bezent_contract.wasm)
          echo "contract code: $size bytes"
          test "$size" -le $((192 * 1024))
      # What a reviewer needs to publish this exact build. The code hash is the blake2_256 of the code
      # blob (`b2sum -l 256`); cargo-contract records the same value as `source.hash` in the bundle.
      - name: Code hash and bundle digest
        run: |
          bundle=target/ink/bezent_contract.contract
          blob=target/ink/bezent_contract.wasm
          code_hash="0x$(b2sum -l 256 "$blob" | cut -d' ' -f1)"
          test "$code_hash" = "$(jq -r '.source.hash' "$bundle")"
          ink_version=$(sed -n '/^name = "ink"$/{n;s/^version = "\(.*\)"$/\1/p;}' Cargo.lock | head -n1)
          {
            echo "### bezent contract build"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| code hash (blake2_256 of the code blob) | \`$code_hash\` |"
            echo "| bundle sha256 (\`bezent_contract.contract\`) | \`$(sha256sum "$bundle" | cut -d' ' -f1)\` |"
            echo "| code blob size | $(stat -c %s "$blob") bytes |"
            echo "| git commit | \`$GITHUB_SHA\` |"
            echo "| cargo-contract | $(cargo contract --version | head -n1) |"
            echo "| rustc | $(rustc --version) |"
            echo "| cargo | $(cargo --version) |"
            echo "| ink! | $ink_version |"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: bezent-contract
          if-no-files-found: error
          path: |
            contracts/bezent/target/ink/bezent_contract.contract
            contracts/bezent/target/ink/bezent_contract.wasm
            contracts/bezent/target/ink/bezent_contract.json
